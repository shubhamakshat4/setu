<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Setu Portal · Sri Sri University</title>
  <meta name="description" content="Setu mentor and admin dashboard — Sri Sri University industry mentorship.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="portal.css">
  <script src="config.js" defer></script>
  <script src="portal.js" defer></script>
</head>
<body>

<!-- =====================================================================
     SIGN IN — email → 6-digit code (no passwords)
     ===================================================================== -->
<section class="login" id="login" hidden>
  <div class="login__card">
    <img class="login__logo" src="assets/ssu-logo.png" width="640" height="206" alt="Sri Sri University">
    <p class="eyebrow">Setu · Industry mentorship</p>
    <h1 class="login__title">Welcome back</h1>

    <form id="emailForm" class="login__form" novalidate>
      <label class="field__label" for="loginEmail">Your email</label>
      <input class="input" id="loginEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@company.com" required>
      <p class="login__hint">Use the email you signed up with. We'll send you a one-time code.</p>
      <button class="btn btn--gold btn--block" type="submit">Send me a code</button>
    </form>

    <form id="codeForm" class="login__form" novalidate hidden>
      <label class="field__label" for="loginCode">6-digit code</label>
      <input class="input input--code" id="loginCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
      <p class="login__hint" id="codeHint"></p>
      <button class="btn btn--gold btn--block" type="submit">Sign in</button>
      <div class="login__row">
        <button class="linkbtn" type="button" id="changeEmail">Use a different email</button>
        <button class="linkbtn" type="button" id="resendCode">Resend code</button>
      </div>
    </form>

    <p class="login__msg" id="loginMsg" role="alert"></p>
    <p class="login__foot">New here? <a href="./">Sign up as a mentor</a></p>
  </div>
</section>

<!-- =====================================================================
     THE APP — top bar, navigation, and the current view
     ===================================================================== -->
<div class="shell" id="shell" hidden>
  <header class="topbar">
    <a class="topbar__brand" href="#/" aria-label="Setu portal home">
      <img src="assets/ssu-logo.png" width="640" height="206" alt="Sri Sri University" class="topbar__logo">
      <span class="topbar__name">Setu <span>Portal</span></span>
    </a>
    <div class="topbar__right">
      <div class="switch" id="modeSwitch" hidden role="group" aria-label="Dashboard">
        <a href="#/home" data-mode="mentor">Mentor</a>
        <a href="#/admin" data-mode="admin">Admin</a>
      </div>
      <button class="avatar-btn" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="userAvatar"></span>
      </button>
      <div class="usermenu" id="userMenu" hidden>
        <p class="usermenu__name" id="userName"></p>
        <p class="usermenu__email" id="userEmail"></p>
        <button class="btn btn--line btn--block" type="button" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <div class="acting" id="actingBar" hidden></div>

  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
</div>

<!-- Pop-up form used for scheduling, projects, students… -->
<dialog class="modal" id="modal" aria-labelledby="modalTitle">
  <form class="modal__form" id="modalForm" novalidate>
    <header class="modal__head">
      <h2 id="modalTitle"></h2>
      <button type="button" class="iconbtn" data-close-modal aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal__body" id="modalBody"></div>
    <p class="modal__error" id="modalError" role="alert" hidden></p>
    <footer class="modal__foot">
      <button type="button" class="btn btn--line" data-close-modal>Cancel</button>
      <button type="submit" class="btn btn--gold" id="modalSubmit">Save</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Please enable JavaScript to use the Setu portal.</p></noscript>
</body>
</html>
